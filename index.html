<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedVax Health</title>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Meta Tags -->
    <meta
      name="keywords"
      content="MedVax Health, healthcare technology, AI supply chains, reproductive health, vaccines, telemedicine"
    />
    <meta
      name="description"
      content="MedVax Health - Medvax is a Nigeria’s first E-pharmacy platform for last mile access to the OTCs, Prescription-only medicines and healthcare products that’s optimized to meet women’s needs."
    />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:title" content="MedVax Health" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Medvax is a Nigeria’s first E-pharmacy platform for last mile access to the OTCs, Prescription-only medicines and healthcare products that’s optimized to meet women’s needs."
    />
    <meta
      property="og:image"
      content="https://medvaxhealth.com/asset/images/social-image.png"
    />
    <meta property="og:url" content="https://medvaxhealth.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MedVax Health" />
    <meta
      name="twitter:description"
      content="Medvax is a Nigeria’s first E-pharmacy platform for last mile access to the OTCs, Prescription-only medicines and healthcare products that’s optimized to meet women’s needs."
    />
    <meta
      name="twitter:image"
      content="https://medvaxhealth.com/asset/images/social-image.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MedVax Health",
        "url": "https://medvaxhealth.com",
        "logo": "https://medvaxhealth.com/favicon.svg",
        "sameAs": [
          "https://twitter.com/YourMedvaxHandle",
          "https://www.linkedin.com/company/medvax",
          "https://facebook.com/medvax"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+234-XXXXXXXXXX",
          "contactType": "customer service",
          "areaServed": "NG",
          "availableLanguage": "English"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MedVax Health",
        "url": "https://medvaxhealth.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://medvaxhealth.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "itemListElement": [
          {
            "@type": "SiteNavigationElement",
            "position": 1,
            "name": "E-Pharmacy",
            "url": "https://medvaxhealth.com/e-pharmacy"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 2,
            "name": "Blog",
            "url": "https://medvaxhealth.com/blog"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 3,
            "name": "Team",
            "url": "https://medvaxhealth.com/team"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 4,
            "name": "Innovation",
            "url": "https://medvaxhealth.com/innovation"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
